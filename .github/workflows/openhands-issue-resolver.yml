name: OpenHands Issue Resolver

on:
  issues:
    types: [labeled]

jobs:
  fix_issue:
    if: github.event.label.name == 'fix-me'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run OpenHands AI Action
        uses: all-hands-ai/openhands-github-action@v1
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: "openrouter/deepseek/deepseek-chat"
          LLM_BASE_URL: "https://openrouter.ai/api/v1"
        with:
          prompt: |
            다음 이슈 요구사항에 맞게 코드를 구현해줘:
            [제목] ${{ github.event.issue.title }}
            [본문] ${{ github.event.issue.body }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix: OpenHands auto issue resolver (#${{ github.event.issue.number }})"
          title: "🤖 [OpenHands] 이슈 #${{ github.event.issue.number }} 자동 해결"
          body: "이슈 #${{ github.event.issue.number }} 해결을 위한 PR입니다."
          branch: "openhands/fix-issue-${{ github.event.issue.number }}"
          delete-branch: true
